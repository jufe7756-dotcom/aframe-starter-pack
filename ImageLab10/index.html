<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>

  <body>

      <a-box position="-1 0.5 -3" rotation="0 0 0" height=".8"color="#E1BC6D"></a-box>
      <a-cone position="-1 1.15 -3" rotation="0 45 0" segments-radial="4" radius-top="0" radius-bottom=".75" height=".5" color="#E1BC6D"></a-cone>


      <a-box position="-.35 0.5 -3.65" rotation="0 0 0" depth=".3" width=".3" height="1" color="#E1BC6D"></a-box>
      <a-box position="-.35 0.5 -2.35" rotation="0 0 0" depth=".3" width=".3" height="1" color="#E1BC6D"></a-box>

      <a-cone position="-.35 1.1 -3.65" rotation="0 45 0" segments-radial="4" radius-top="0" radius-bottom=".21" height=".2" color="#E1BC6D"></a-cone>

      <a-cone position="-1.65 1.1 -3.65" rotation="0 45 0" segments-radial="4" radius-top="0" radius-bottom=".21" height=".2" color="#E1BC6D"></a-cone>
      <a-cone position="-1.65 1.1 -2.35" rotation="0 45 0" segments-radial="4" radius-top="0" radius-bottom=".21" height=".2" color="#E1BC6D"></a-cone>



      <a-sphere position="1 1 -3" radius=".18" color="#EF2D5E"></a-sphere>
      <a-cone position="1 0.75 -3" radius-top=".167" radius-bottom="0" height=".5" color="#FFC65D"></a-cone> 
      <a-sky src="#skyTexture" rotation="0 180 0"></a-sky>
    </a-scene>

</html>
