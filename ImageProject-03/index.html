<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
      <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>

  </head>
  <body>
    <a-scene>
      <a-assets>
        <img id="skyTexture" src="AdobeStock_407546309.jpeg">
        <a-asset-item id="knights" src="knights/scene.gltf"></a-asset-item>
        <a-asset-item id="pawns" src="scene.gltf"></a-asset-item>
        <a-asset-item id="board" src="board.gltf"></a-asset-item>
        <a-asset-item id="ship" src="ship.gltf"></a-asset-item>
      </a-assets>
      <a-sky src="#skyTexture"></a-sky>
       <a-entity environment="preset: checkerboard; seed: 12; dressingAmount: 82; fog: 0; skyType: none; playArea: 30"></a-entity>
      <a-entity gltf-model ="#knights" position="0 0 -11" scale="40 40 40" rotation="0 0 0"></a-entity>
      <a-entity gltf-model ="#pawns" position="0 0 -6" scale="60 60 60"></a-entity> 
       <a-entity gltf-model ="#board" position="0 0 -30" scale="60 60 60" rotation="0 -45 0"></a-entity>
      <a-entity gltf-model ="#ship" position="0 80 -80" scale="60 60 60" rotation="0 45 0"></a-entity>
    </a-scene>
    </body>
</html>
